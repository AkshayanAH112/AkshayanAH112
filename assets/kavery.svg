<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Kavery Sports Club: architecture on Cloudflare">
<title>Kavery Sports Club: architecture on Cloudflare</title>
<style>
  text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .ink { fill: #1f2328; } .muted { fill: #59636e; } .acc { fill: #1f7a4a; } .on { fill: #ffffff; }
  .panel { fill: #f2f4f1; } .panel2 { fill: #e3e8e1; } .accp { fill: #e3f1e8; }
  .wire { stroke: #8c959f; fill: none; } .wiref { fill: #8c959f; }
  @media (prefers-color-scheme: dark) {
    .ink { fill: #e6edf3; } .muted { fill: #9198a1; } .acc { fill: #2f9a68; }
    .panel { fill: #161b22; } .panel2 { fill: #222a33; } .accp { fill: #13301f; }
    .wire { stroke: #6e7681; } .wiref { fill: #6e7681; }
  }
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="wiref"/></marker></defs>
<rect x="0" y="30" width="250" height="112" rx="6" class="panel"/><text x="16" y="58" font-size="17" font-weight="600" text-anchor="start" class="ink">Public site</text><text x="16" y="82" font-size="14" font-weight="400" text-anchor="start" class="muted">English and Tamil</text><text x="16" y="103" font-size="14" font-weight="400" text-anchor="start" class="muted">news, gallery, results,</text><text x="16" y="124" font-size="14" font-weight="400" text-anchor="start" class="muted">live match scores</text>
<rect x="0" y="162" width="250" height="112" rx="6" class="panel"/><text x="16" y="190" font-size="17" font-weight="600" text-anchor="start" class="ink">Staff console</text><text x="16" y="214" font-size="14" font-weight="400" text-anchor="start" class="muted">installable app</text><text x="16" y="235" font-size="14" font-weight="400" text-anchor="start" class="muted">5 roles, from admin</text><text x="16" y="256" font-size="14" font-weight="400" text-anchor="start" class="muted">to ball-by-ball scorer</text>
<polyline points="250,86 300,86 300,140 340,140" class="wire" stroke-width="2" marker-end="url(#head)"/>
<polyline points="250,218 300,218 300,166 340,166" class="wire" stroke-width="2" marker-end="url(#head)"/>
<rect x="340" y="92" width="300" height="120" rx="6" class="accp"/><text x="356" y="120" font-size="17" font-weight="600" text-anchor="start" class="ink">Next.js 16 on Workers</text><text x="356" y="144" font-size="14" font-weight="400" text-anchor="start" class="muted">OpenNext adapter</text><text x="356" y="165" font-size="14" font-weight="400" text-anchor="start" class="muted">70 route handlers, 46 pages</text><text x="356" y="186" font-size="14" font-weight="400" text-anchor="start" class="muted">zod-validated input</text>
<polyline points="640,120 700,60" class="wire" stroke-width="2" marker-end="url(#head)"/>
<polyline points="640,152 700,152" class="wire" stroke-width="2" marker-end="url(#head)"/>
<polyline points="640,184 700,244" class="wire" stroke-width="2" marker-end="url(#head)"/>
<rect x="700" y="20" width="300" height="80" rx="6" class="panel"/><text x="716" y="48" font-size="17" font-weight="600" text-anchor="start" class="ink">D1</text><text x="716" y="72" font-size="14" font-weight="400" text-anchor="start" class="muted">SQLite at the edge, Drizzle ORM</text>
<rect x="700" y="112" width="300" height="80" rx="6" class="panel"/><text x="716" y="140" font-size="17" font-weight="600" text-anchor="start" class="ink">R2</text><text x="716" y="164" font-size="14" font-weight="400" text-anchor="start" class="muted">photos and gallery files</text>
<rect x="700" y="204" width="300" height="80" rx="6" class="panel"/><text x="716" y="232" font-size="17" font-weight="600" text-anchor="start" class="ink">Web Push</text><text x="716" y="256" font-size="14" font-weight="400" text-anchor="start" class="muted">notifications sent from the console</text>
</svg>
