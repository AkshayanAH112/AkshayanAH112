<rect x="700" y="132" width="300" height="104" rx="6" class="panel"/><text x="716" y="160" font-size="17" font-weight="600" text-anchor="start" class="ink">Mobile API</text><text x="716" y="184" font-size="14" font-weight="400" text-anchor="start" class="muted">Next.js route handlers</text><text x="716" y="205" font-size="14" font-weight="400" text-anchor="start" class="muted">bearer-token auth, role checks</text>
<polyline points="790,236 790,300" class="wire" stroke-width="2" marker-end="url(#head)"/>
<polyline points="910,236 910,300" class="wire" stroke-width="2" marker-end="url(#head)"/>
<rect x="700" y="300" width="140" height="120" rx="6" class="panel"/><text x="716" y="328" font-size="17" font-weight="600" text-anchor="start" class="ink">Supabase</text><text x="716" y="352" font-size="14" font-weight="400" text-anchor="start" class="muted">Postgres</text><text x="716" y="373" font-size="14" font-weight="400" text-anchor="start" class="muted">70 migrations</text><text x="716" y="394" font-size="14" font-weight="400" text-anchor="start" class="muted">auth, storage</text>
<rect x="860" y="300" width="140" height="120" rx="6" class="panel"/><text x="876" y="328" font-size="17" font-weight="600" text-anchor="start" class="ink">Stripe</text><text x="876" y="352" font-size="14" font-weight="400" text-anchor="start" class="muted">card payments</text><text x="876" y="373" font-size="14" font-weight="400" text-anchor="start" class="muted">coach paid</text><text x="876" y="394" font-size="14" font-weight="400" text-anchor="start" class="muted">after session</text>
<text x="320" y="470" font-size="14" font-weight="400" text-anchor="start" class="muted">Redrawn from the app. Green: the mobile apps I built. I also wrote the</text>
<text x="320" y="491" font-size="14" font-weight="400" text-anchor="start" class="muted">mobile API on Crikly’s shared Next.js and Supabase backend.</text>
