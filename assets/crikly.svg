<rect x="320" y="136" width="300" height="96" rx="6" class="accp"/><text x="336" y="164" font-size="17" font-weight="600" text-anchor="start" class="ink">Coach workspace app</text><text x="336" y="188" font-size="14" font-weight="400" text-anchor="start" class="muted">Expo, runs in Expo Go</text><text x="336" y="209" font-size="14" font-weight="400" text-anchor="start" class="muted">sessions, students, reports</text>
<rect x="320" y="252" width="300" height="96" rx="6" class="panel"/><text x="336" y="280" font-size="17" font-weight="600" text-anchor="start" class="ink">Training Passport</text><text x="336" y="304" font-size="14" font-weight="400" text-anchor="start" class="muted">a child’s sessions and coach</text><text x="336" y="325" font-size="14" font-weight="400" text-anchor="start" class="muted">reports, with privacy settings</text>
